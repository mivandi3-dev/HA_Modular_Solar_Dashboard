name: Solarni monitor
version: "5.1.1-ha1"
slug: solarni_dashboard
url: https://github.com/mivandi3-dev/HA_Modular_Solar_Dashboard
description: Nadzorna ploča solarne elektrane (27 widgeta, 6 stranica, teme, izvještaji) – podatke vuče sa Solarnog poslužitelja
arch: [aarch64, amd64]
init: false
ingress: true
panel_icon: mdi:solar-power
panel_title: Solarni monitor
map:
  - type: share           # /share/solarni/api_token (zapisuje ga Solarni poslužitelj)
    read_only: true
ports:
  8600/tcp: null          # pregled iz mreže (TV u predvorju bez HA računa) – uključite upisom porta
ports_description:
  8600/tcp: Pregled iz lokalne mreže (samo čitanje, pristupni ključ)
options:
  server_url: "http://172.30.32.1:8700"
  api_token: ""
  log_level: info
schema:
  server_url: url
  api_token: password?
  log_level: list(debug|info|warning|error)
